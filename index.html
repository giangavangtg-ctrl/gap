<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành grid-gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Ví dụ 1: Thiết lập khoảng cách hàng và cột bằng nhau (20px)</h2>
    <div class="grid-container grid-gap-equal">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau (Hàng: 30px, Cột: 10px)</h2>
    <div class="grid-container grid-gap-diff">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>
</html>
